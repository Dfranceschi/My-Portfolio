<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      color-scheme: light;
      --page-bg: #FDE1DE;
      --page-fg: #343538;
      --link-color: #343538;
      --border-color: #343538;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #A57982;
      --page-fg: #343538;
      --link-color: #343538;
      --border-color: #343538;
    }
    html, body { min-height: 100%; }
    body {
      position: relative;
      padding-bottom: 75px;
      background-color: var(--page-bg);
      color: var(--page-fg);
      transition: background-color .25s ease, color .25s ease;
    }
    p, span, li, h1, h2, h3, strong { color: inherit; }
    :root[data-theme="dark"] p { color: #fff; }
    a { color: var(--link-color); }
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 75px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }
    #theme-btn {
      position: fixed;
      z-index: 1050;
      top: 1rem;
      right: 1rem;
      width: 44px;
      height: 44px;
      border: 2px solid var(--border-color);
      border-radius: 50%;
      background: transparent;
      color: var(--page-fg);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    #theme-btn:focus-visible { outline: 3px solid var(--link-color); outline-offset: 3px; }
    #sun-icon { display: none; }
    :root[data-theme="dark"] #moon-icon { display: none; }
    :root[data-theme="dark"] #sun-icon { display: block; }
    @media (prefers-reduced-motion: reduce) { body { transition: none; } }
  </style>
</head>
<body id="top">
  <button id="theme-btn" type="button" aria-label="Switch to dark mode" aria-pressed="false">
    <svg id="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
    </svg>
    <svg id="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
  </button>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="logo3" src="dzimg/dzcolorlogo.png" alt="Circular logo with DZ initials and petroglyphs">
      <span class="brand-name">My Portfolio</span>
      <span class="brand-name">Damaris Zuluaga</span>
    </a>
  </header>

  <nav aria-label="Main navigation">
    <a href="#main" class="outofsight">Skip to Main Content</a>
    <ul class="site-nav">
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="branding.html">Branding</a></li>
      <li><a href="rebranding.html">Rebranding</a></li>
      <li><a href="aboutme.html">About Me</a></li>
      <li><a href="contactinfo.html">Contact Info</a></li>
    </ul>
  </nav>

  <main id="main">
    <div class="portrait-container">
      <img class="selfimg" src="dzimg/grilintherain.png" alt="Woman looking up at rain.">
      <div class="text-overlay">
        <h1>Welcome to my Page!</h1>
        <p>Take a look around and check out some of the work I've done!</p>
      </div>
    </div>
  </main>

  <footer>
    <a href="#top">&#11014; Back to top</a>
    <p>&copy; 2026</p>
  </footer>

  <script>
    const root = document.documentElement;
    const themeButton = document.getElementById('theme-btn');
    const savedTheme = localStorage.getItem('theme');
    function setTheme(theme) {
      const isDark = theme === 'dark';
      root.dataset.theme = isDark ? 'dark' : 'light';
      themeButton.setAttribute('aria-pressed', String(isDark));
      themeButton.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    setTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    themeButton.addEventListener('click', () => {
      const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(nextTheme);
      localStorage.setItem('theme', nextTheme);
    });
  </script>
  <script src="js/function.js"></script>
</body>
</html>
