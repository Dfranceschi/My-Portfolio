<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FDE1DE">
  <meta name="description" content="A quiet, image-first photo gallery.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      color-scheme: light;
      --page-bg: #FDE1DE;
      --page-fg: #343538;
      --surface-bg: #FDE1DE;
      --link-color: #343538;
      --border-color: #343538;
      --brand-blush: #FDE1DE;
      --muted: #5f5758;
      --gutter: clamp(16px, 3.2vw, 48px);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #A57982;
      --page-fg: #343538;
      --surface-bg: #A57982;
      --link-color: #343538;
      --border-color: #343538;
      --brand-blush: #A57982;
      --muted: #fff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    html { background: var(--page-bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      position: relative;
      padding-bottom: 75px;
      color: var(--page-fg);
      background: var(--page-bg);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      transition: background-color .25s ease, color .25s ease;
    }
    p, span { color: inherit; }
    :root[data-theme="dark"] .note { color: #fff; }
    header {
      min-height: 86px;
      padding: 22px var(--gutter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { font-size: 20px; font-weight: 650; letter-spacing: -.035em; color: var(--link-color); text-decoration: none; }
    .note { margin: 0 56px 0 0; color: var(--muted); font-size: 15px; letter-spacing: .02em; }
    .site-nav a { font-size: 18px; }
    .site-nav a { font-size: 19px; }
    main { padding: 10px var(--gutter) 48px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: clamp(12px, 1.6vw, 24px);
    }
    .photo {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
      break-inside: avoid;
      overflow: hidden;
    }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
      background: transparent;
      transition: opacity 180ms ease;
    }
    .photo:hover img { opacity: .88; }
    .photo:focus-visible { outline: 2px solid var(--page-fg); outline-offset: 4px; }
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 75px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      color: var(--muted);
      font-size: 16px;
      font-size: 18px;
    }
    footer p { margin: 0; }
    #theme-btn {
      position: fixed; z-index: 1050; top: 1rem; right: 1rem;
      background: var(--surface-bg); border: 2px solid var(--border-color);
      border-radius: 50%; width: 45px; height: 45px; cursor: pointer;
      display: grid; place-items: center; color: var(--page-fg); font-size: 20px;
    }
    #theme-btn:focus-visible { outline: 3px solid var(--link-color); outline-offset: 3px; }
    #theme-btn svg { width: 20px; height: 20px; flex: none; }
    #theme-btn #moon-icon { display: block; }
    #theme-btn #sun-icon { display: none; }
    :root[data-theme="dark"] #theme-btn #moon-icon { display: none; }
    :root[data-theme="dark"] #theme-btn #sun-icon { display: block; }

    dialog {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      color: #fff;
      background: rgba(12, 12, 11, .97);
      overflow: hidden;
    }
    dialog[open] { display: grid; place-items: center; }
    dialog::backdrop { background: rgba(12, 12, 11, .97); }
    .lightbox-image {
      display: block;
      max-width: min(94vw, 1800px);
      max-height: 88dvh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .lightbox-bar {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      pointer-events: none;
    }
    .lightbox-count { color: rgba(255,255,255,.72); font-size: 15px; font-variant-numeric: tabular-nums; }
    .close {
      width: 42px; height: 42px; border: 0; border-radius: 50%;
      color: white; background: rgba(255,255,255,.12); font-size: 25px;
      cursor: pointer; pointer-events: auto;
    }
    .close:hover { background: rgba(255,255,255,.22); }
    .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 46px; height: 56px; border: 0; color: white;
      background: rgba(255,255,255,.10); font-size: 28px; cursor: pointer;
    }
    .nav:hover { background: rgba(255,255,255,.2); }
    .previous { left: 16px; }
    .next { right: 16px; }
    .caption {
      position: absolute; inset: auto 0 0; padding: 32px 24px 22px;
      text-align: center; color: rgba(255,255,255,.75); font-size: 15px;
      background: linear-gradient(transparent, rgba(0,0,0,.4));
    }
    @media (max-width: 600px) {
      header { min-height: 68px; }
      main { padding-top: 4px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .lightbox-image { max-width: 100vw; max-height: 82dvh; }
      .previous { left: 8px; }
      .next { right: 8px; }
      .lightbox-bar { padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      html { scroll-behavior: auto; }
      body { transition: none; }
    }
  </style>
</head>

  <script>
    (() => {
      const themeButton = document.querySelector('#theme-btn');
      const root = document.documentElement;
      let savedTheme = 'light';
      try { savedTheme = localStorage.getItem('theme') || 'light'; } catch {}
      function setTheme(theme) {
        root.dataset.theme = theme;
        const isDark = theme === 'dark';
        themeButton.setAttribute('aria-pressed', String(isDark));
        themeButton.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#A57982' : '#FDE1DE';
        try { localStorage.setItem('theme', theme); } catch {}
      }
      setTheme(savedTheme);
      themeButton.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));

      const photos = [...document.querySelectorAll('.photo img')];
      const dialog = document.querySelector('#lightbox');
      const largeImage = dialog.querySelector('.lightbox-image');
      const count = document.querySelector('#count');
      const caption = document.querySelector('#caption');
      let current = 0;
      let opener;

      function show(index) {
        current = (index + photos.length) % photos.length;
        const photo = photos[current];
        largeImage.src = photo.src.replace(/w=\d+/, 'w=2000').replace(/q=\d+/, 'q=85');
        largeImage.alt = photo.alt;
        caption.textContent = photo.alt;
        count.textContent = `${String(current + 1).padStart(2, '0')} / ${String(photos.length).padStart(2, '0')}`;
      }
      function open(index) {
        opener = document.activeElement;
        show(index);
        dialog.showModal();
      }
      photos.forEach((photo, index) => {
        photo.closest('button').addEventListener('click', () => open(index));
      });
      dialog.querySelector('.close').addEventListener('click', () => dialog.close());
      dialog.querySelector('.previous').addEventListener('click', () => show(current - 1));
      dialog.querySelector('.next').addEventListener('click', () => show(current + 1));
      dialog.addEventListener('click', event => {
        if (event.target === dialog) dialog.close();
      });
      dialog.addEventListener('close', () => opener?.focus());
      dialog.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') show(current - 1);
        if (event.key === 'ArrowRight') show(current + 1);
      });
    })();
  </script>
