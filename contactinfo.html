<main>
  <section class="container py-5 contact-section" aria-labelledby="contact-heading">
  <!-- Contact details and form -->
    <div class="row g-5">
      <div class="col-md-5">
        <h1 id="contact-heading">Contact Me</h1>
        <p>Have a question or want to work together? Get in touch.</p>
        
      
        
      </div>

      <div class="col-md-7">
        <form action="https://formspree.io/f/mrppnbzp" method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Your name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Send message</button>
        </form>
      </div>
    </div>
  </section>

  <section class="container pb-5 resume-section" aria-labelledby="resume-heading">
     <!-- Resume heading, description, and buttons -->
