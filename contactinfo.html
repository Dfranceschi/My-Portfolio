<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Contact Info</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      color-scheme: light;
      --page-bg: #FDE1DE;
      --page-fg: #343538;
      --surface-bg: #FDE1DE;
      --link-color: #343538;
      --border-color: #343538;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #A57982;
      --page-fg: #343538;
      --surface-bg: #A57982;
      --link-color: #343538;
      --border-color: #343538;
    }
    html, body { min-height: 100%; }
    body {
      position: relative;
      padding-bottom: 75px;
      background-color: var(--page-bg);
      color: var(--page-fg);
      transition: background-color .25s ease, color .25s ease;
    }
    p, span, li, h1, h2, h3, strong, label { color: inherit; }
    :root[data-theme="dark"] p { color: #fff; }
    a { color: var(--link-color); }
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 75px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }
    #theme-btn {
      position: fixed;
      z-index: 1050;
      top: 1rem;
      right: 1rem;
      width: 44px;
      height: 44px;
      border: 2px solid var(--border-color);
      border-radius: 50%;
      background: transparent;
      color: var(--page-fg);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    #theme-btn:focus-visible { outline: 3px solid var(--link-color); outline-offset: 3px; }
    #sun-icon { display: none; }
    :root[data-theme="dark"] #moon-icon { display: none; }
    :root[data-theme="dark"] #sun-icon { display: block; }
    :root[data-theme="dark"] .form-control {
      background-color: #f6eeee;
      color: #343538;
      border-color: #343538;
    }
    @media (prefers-reduced-motion: reduce) { body { transition: none; } }
  </style>
</head>
<body id="top">
  <button id="theme-btn" type="button" aria-label="Switch to dark mode" aria-pressed="false">
    <svg id="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
    </svg>
    <svg id="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
  </button>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="logo3" src="dzimg/dzcolorlogo.png" alt="Circular logo with DZ initials and petroglyphs">
      <span class="brand-name">Contact Info</span>
    </a>
  </header>

  <nav aria-label="Main navigation">
    <a href="#main" class="outofsight">Skip to Main Content</a>
    <ul class="site-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="branding.html">Branding</a></li>
      <li><a href="rebranding.html">Rebranding</a></li>
      <li><a href="typography.html">Typography</a></li>
      <li><a href="aboutme.html">About Me</a></li>
      <li><a href="contactinfo.html" aria-current="page">Contact Info</a></li>
    </ul>
  </nav>

  <main id="main">
    <section class="container py-5 contact-section" aria-labelledby="contact-heading">
      <div class="row g-5">
        <div class="col-md-5">
          <h1 id="contact-heading">Contact Me</h1>
          <p>Have a question or want to work together? Get in touch.</p>
        </div>
        <div class="col-md-7">
          <form action="https://formspree.io/f/mrppnbzp" method="post">
            <div class="mb-3">
              <label for="name" class="form-label">Your name</label>
              <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send message</button>
          </form>
        </div>
      </div>
    </section>

    <section class="container pb-5 resume-section" aria-labelledby="resume-heading">
      <h2 id="resume-heading">My Resume</h2>
      <p>View or download my resume.</p>
      <a class="btn btn-primary" href="https://drive.google.com/file/d/1aUktwGpY4FSje_Ol7uQoWdLDkhjFKAtt/view?usp=sharing" target="_blank" rel="noopener">View resume</a>
    </section>
  </main>

  <footer>
    <a href="#top">&#11014; Back to top</a>
    <p>&copy; 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const root = document.documentElement;
    const themeButton = document.getElementById('theme-btn');
    const savedTheme = localStorage.getItem('theme');
    function setTheme(theme) {
      const isDark = theme === 'dark';
      root.dataset.theme = isDark ? 'dark' : 'light';
      themeButton.setAttribute('aria-pressed', String(isDark));
      themeButton.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    setTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    themeButton.addEventListener('click', () => {
      const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(nextTheme);
      localStorage.setItem('theme', nextTheme);
    });
  </script>
  <script src="js/function.js"></script>
</body>
</html>
